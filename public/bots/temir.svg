<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="circle-temir">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
    <linearGradient id="bg-temir" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1A10"/>
      <stop offset="100%" style="stop-color:#1A2D1A"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="100" fill="url(#bg-temir)"/>
  <g clip-path="url(#circle-temir)">
    <!-- Body - work jacket, practical -->
    <ellipse cx="100" cy="215" rx="75" ry="58" fill="#2A3520"/>
    <!-- Work jacket collar -->
    <path d="M65 175 Q100 162 135 175 L132 200 Q100 188 68 200 Z" fill="#1E2818"/>
    <!-- Jacket pocket -->
    <rect x="110" y="180" width="18" height="14" rx="3" fill="#1A2215" opacity="0.8"/>
    <!-- Neck - weathered -->
    <rect x="87" y="148" width="26" height="24" rx="8" fill="#A07050"/>
    <!-- Head - broader, weathered -->
    <ellipse cx="100" cy="120" rx="40" ry="42" fill="#A07050"/>
    <!-- Sun-weathered skin texture -->
    <path d="M75 110 Q100 107 125 110" stroke="#8A5E38" stroke-width="1" fill="none" opacity="0.3"/>
    <!-- Eyes - steady, patient -->
    <ellipse cx="84" cy="116" rx="8" ry="6" fill="#1A1005"/>
    <ellipse cx="116" cy="116" rx="8" ry="6" fill="#1A1005"/>
    <!-- Eye whites -->
    <ellipse cx="82" cy="115" rx="3.5" ry="2.8" fill="#EDE8E0"/>
    <ellipse cx="114" cy="115" rx="3.5" ry="2.8" fill="#EDE8E0"/>
    <!-- Pupils - dark brown -->
    <circle cx="83" cy="116" r="2.2" fill="#0A0800"/>
    <circle cx="115" cy="116" r="2.2" fill="#0A0800"/>
    <!-- Eye highlight -->
    <circle cx="84" cy="114.5" r="0.8" fill="white" opacity="0.7"/>
    <circle cx="116" cy="114.5" r="0.8" fill="white" opacity="0.7"/>
    <!-- Eyebrows - thick, dark, heavy -->
    <path d="M74 106 Q84 102 94 105" stroke="#2A1505" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M106 105 Q116 102 126 106" stroke="#2A1505" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Nose - strong, broad -->
    <path d="M96 122 Q93 130 90 133 Q100 137 110 133 Q107 130 104 122" fill="#8A6040" opacity="0.6"/>
    <!-- Mouth - straight, closed, serious -->
    <path d="M85 142 Q100 144 115 142" stroke="#6A3A20" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Stubble / slight beard -->
    <path d="M78 135 Q100 148 122 135 Q125 148 100 160 Q75 148 78 135 Z" fill="#4A3020" opacity="0.35"/>
    <!-- Stubble dots -->
    <circle cx="85" cy="140" r="1" fill="#3A2015" opacity="0.4"/>
    <circle cx="92" cy="143" r="1" fill="#3A2015" opacity="0.4"/>
    <circle cx="100" cy="145" r="1" fill="#3A2015" opacity="0.4"/>
    <circle cx="108" cy="143" r="1" fill="#3A2015" opacity="0.4"/>
    <circle cx="115" cy="140" r="1" fill="#3A2015" opacity="0.4"/>
    <!-- Hair - short, dark with grey -->
    <path d="M60 112 Q63 80 100 74 Q137 80 140 112 Q132 88 100 84 Q68 88 60 112 Z" fill="#2A2015"/>
    <!-- Grey streaks at temples -->
    <path d="M62 105 Q64 112 66 120" stroke="#8A8070" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M138 105 Q136 112 134 120" stroke="#8A8070" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Forehead line - weathered -->
    <path d="M76 98 Q100 95 124 98" stroke="#8A6040" stroke-width="1" fill="none" opacity="0.4"/>
    <!-- Laugh/age lines -->
    <path d="M72 122 Q70 130 72 140" stroke="#8A6040" stroke-width="1" fill="none" opacity="0.4"/>
    <path d="M128 122 Q130 130 128 140" stroke="#8A6040" stroke-width="1" fill="none" opacity="0.4"/>
  </g>
  <!-- Green earthy border - steppe, work -->
  <circle cx="100" cy="100" r="97" fill="none" stroke="#4A7030" stroke-width="3" opacity="0.7"/>
</svg>
