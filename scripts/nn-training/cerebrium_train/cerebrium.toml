[cerebrium.deployment]
name = "damadojo-train"
python_version = "3.11"
docker_base_image_url = "debian:bookworm-slim"
disable_auth = true
include = ['./main.py', './cerebrium.toml']
exclude = []

[cerebrium.hardware]
cpu = 4.0
memory = 16.0
compute = "ADA_L4"
region = "us-east-1"

[cerebrium.scaling]
min_replicas = 0
max_replicas = 1
cooldown = 30
replica_concurrency = 1
scaling_metric = "concurrency_utilization"
response_grace_period = 1800

[cerebrium.dependencies.pip]
numpy = "1.26.4"
torch = "2.4.0"
